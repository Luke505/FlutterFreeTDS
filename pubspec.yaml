name: freetds
version: 3.0.0
description: FreeTDS package
publish_to: 'none'
homepage: https://github.com/Luke505/FlutterFreeTDS
repository: https://github.com/Luke505/FlutterFreeTDS
issue_tracker: https://github.com/Luke505/FlutterFreeTDS/issues

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.27.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  uuid: ^4.5.3
  tempo: ^1.2.2
  queue: ^3.4.0
  # noinspection SpellCheckingInspection
  fixnum: ^1.1.1
  logger: ^2.7.0
  decimal: ^3.2.4

dev_dependencies:
  flutter_lints:
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  dart_docker:
    path: ./tools/dart_docker # version: 0.0.2

flutter:
  plugin:
    platforms:
      android:
        package: net.developerpass.freetds
        pluginClass: FlutterFreeTdsPlugin
      ios:
        pluginClass: FreeTDSFlutterPlugin
      macos:
        pluginClass: FreeTDSFlutterPlugin
      windows:
        pluginClass: freetds_plugin
